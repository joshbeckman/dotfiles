# Pinned installer releases, with the published SHA256 of each architecture's
# archive. setup never asks for a "latest": it reads the version and digest here,
# downloads that exact release, and refuses anything that does not match. The
# expected digest lives in this repo rather than beside the artifact, so a
# substituted download can only be accepted by a commit that also moves the pin.
#
#   <tool>  <version>  <release target>  <sha256>
#
# `bin/pins update` rewrites this file from upstream's published metadata and
# `bin/pins check` says when a pin here or in plugins.lock is behind. Both are
# deliberate: the diff is the review, and nothing moves a pin on its own.
