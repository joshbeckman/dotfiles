# Pinned plugin checkouts, in the order setup installs them.
#
# setup only ever checks a plugin out at the commit named here; nothing follows a
# branch, so upstream is not auto-activated between reviews. The two-hour refresh
# reports (and notifies about) every checkout that moves, whether because this file
# changed or because the checkout had drifted.
#
#   <commit>  <repository url>
#
# Moving a pin is a deliberate act: take whatever each repository publishes now,
# then read the diff before committing it. That diff is the review.
#
#   grep -v '^#' plugins.lock | while read -r sha url; do
#     printf '%s  %s\n' "$(git ls-remote "$url" HEAD | cut -f1)" "$url"
#   done > plugins.lock.new && mv plugins.lock.new plugins.lock
#
# Comments and blank lines are ignored, and a repository that is cloned without an
# entry here is an error rather than an unpinned install.
