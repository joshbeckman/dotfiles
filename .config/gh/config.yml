# What protocol to use when performing git operations. Supported values: ssh, https
git_protocol: https
# What editor gh should run when creating issues, pull requests, etc. If blank, will refer to environment.
editor:
# When to interactively prompt. This is a global config that cannot be overridden by hostname. Supported values: enabled, disabled
prompt: enabled
# A pager program to send command output to, e.g. "less". Set the value to "cat" to disable the pager.
pager:
# Aliases allow you to create nicknames for gh commands
aliases:
    co: pr checkout
    pr-checks: |
        !case "${1:-}" in
          -h|--help)
            printf 'Usage: gh pr-checks [PR_URL|PR_NUMBER|BRANCH] [gh-pr-checks-flags...]\n\nRender the PR'"'"'s checks as a Markdown table sorted by severity\n(fail, pending, cancel, pass, skipping). The Reviews row lists approvers.\nDefaults to the current branch'"'"'s PR.\n\nExamples:\n  gh pr-checks\n  gh pr-checks 1234\n  gh pr-checks --required\n'
            exit 0 ;;
        esac
        case "${1:-}" in
          ""|-*) approvers="$(gw pr view --json latestReviews --jq '.latestReviews | map(select(.state == "APPROVED") | "@" + .author.login) | unique | join(", ")' 2>/dev/null)" ;;
          *) approvers="$(gw pr view "$1" --json latestReviews --jq '.latestReviews | map(select(.state == "APPROVED") | "@" + .author.login) | unique | join(", ")' 2>/dev/null)" ;;
        esac
        export approvers
        printf '| Check | Status | Result |\n| --- | --- | --- |\n'
        gw pr checks "$@" --json bucket,description,link,name,startedAt,completedAt --jq 'def text: gsub("[\\r\\n]+"; " ") | gsub("\\|"; "\\\\|"); def duration: if .startedAt == null or .startedAt == "0001-01-01T00:00:00Z" then "—" else ((if .completedAt == null or .completedAt == "0001-01-01T00:00:00Z" then now else (.completedAt | fromdateiso8601) end) - (.startedAt | fromdateiso8601) | floor) as $s | if $s <= 0 then "—" elif $s < 60 then "\($s)s" elif $s < 3600 then "\($s / 60 | floor)m \($s % 60)s" else "\($s / 3600 | floor)h \($s % 3600 / 60 | floor)m" end end; def rank: {fail: 0, pending: 1, cancel: 2, pass: 3, skipping: 4}[.bucket] // 5; sort_by(rank, .name)[] | "| [\(.name | text)](\(.link)) | \(.bucket) | \(if (.name | ascii_downcase) == "reviews" and env.approvers != "" then "Approved by \(env.approvers)." elif .description != null and .description != "" then (.description | text) else duration end) |"'
    pr-url: |
        !case "${1:-}" in
          -h|--help)
            printf 'Usage: gh pr-url [PR_URL|PR_NUMBER|BRANCH]\n\nPrint the URL of a pull request. Defaults to the current branch'"'"'s PR.\n'
            exit 0 ;;
        esac
        gw pr view "$@" --json url -q .url
    pmerge: |
        !for arg in "$@"; do
          case "$arg" in
            -h|--help)
              printf 'Usage: gh pmerge [PR_URL|PR_NUMBER|BRANCH]\n\nComment "/merge" on a pull request to queue it for merge.\nDefaults to the current branch'"'"'s PR.\n'
              exit 0 ;;
          esac
        done
        gw pr comment "$@" -b "/merge"
    pr-merged: |
        !case "${1:-}" in
          -h|--help)
            printf 'Usage: gh pr-merged [PR_URL|PR_NUMBER|BRANCH]\n\nPrint the merge timestamp of a pull request.\nExits 1 with "not merged" on stderr if it has not merged yet.\nDefaults to the current branch'"'"'s PR.\n'
            exit 0 ;;
        esac
        merged_at="$(gw pr view "$@" --json mergedAt --jq '.mergedAt // empty')" || exit $?
        if [ -n "$merged_at" ]; then
          printf '%s\n' "$merged_at"
        else
          printf 'not merged\n' >&2
          exit 1
        fi
# The path to a unix socket through which send HTTP connections. If blank, HTTP traffic will be handled by net/http.DefaultTransport.
http_unix_socket:
# What web browser gh should use when opening URLs. If blank, will refer to environment.
browser:
version: "1"
