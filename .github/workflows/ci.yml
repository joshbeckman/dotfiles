name: CI

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repo: ${{ steps.select.outputs.repo }}
      skills: ${{ steps.select.outputs.skills }}
      pana: ${{ steps.select.outputs.pana }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Route before allocating macOS runners. Missing history fails open to full
      # coverage; scheduled/manual runs deliberately exercise every suite.
      - id: select
        run: python3 .github/scripts/select-ci.py

  skills:
    name: skill checks
    needs: detect
    if: needs.detect.outputs.skills == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bin/run-tests agent-skills pana-skills

  repo-tests:
    name: repo tests (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.repo == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install neovim tmux coreutils ripgrep
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y neovim tmux sqlite3 ruby ripgrep
      # Pi is npm-only, and test/pi-extensions runs the real CLI rather than a stub.
      - name: Install Pi
        run: npm install -g @earendil-works/pi-coding-agent
      - name: Run test/
        run: bin/run-tests --jobs 4
        env:
          RUN_TESTS_LOGS: ${{ runner.temp }}/test-logs
      - name: Keep test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/test-logs

  pana:
    name: pana (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.pana == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pana/package-lock.json
      - working-directory: pana
        run: npm ci
      - working-directory: pana
        run: npx tsc --noEmit
      - working-directory: pana
        run: npm test

  result:
    name: CI result
    needs: [detect, skills, repo-tests, pana]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful selected suites
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ['NEEDS'])
          assert needs['detect']['result'] == 'success', needs
          selected = needs['detect']['outputs']
          for job, output in [('skills', 'skills'), ('repo-tests', 'repo'), ('pana', 'pana')]:
              expected = 'success' if selected[output] == 'true' else 'skipped'
              assert needs[job]['result'] == expected, needs
          PY
